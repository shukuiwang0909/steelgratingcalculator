<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Bearing bars (horizontal, thick amber) -->
  <rect x="2" y="5"  width="28" height="4" rx="1" fill="#f59e0b"/>
  <rect x="2" y="13" width="28" height="4" rx="1" fill="#f59e0b"/>
  <rect x="2" y="21" width="28" height="4" rx="1" fill="#f59e0b"/>
  <!-- Cross bars (vertical, thin, semi-transparent) -->
  <rect x="7"  y="2" width="2" height="28" rx="1" fill="#f59e0b" opacity="0.45"/>
  <rect x="15" y="2" width="2" height="28" rx="1" fill="#f59e0b" opacity="0.45"/>
  <rect x="23" y="2" width="2" height="28" rx="1" fill="#f59e0b" opacity="0.45"/>
</svg>
